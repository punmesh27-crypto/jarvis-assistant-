workflows:
  jarvis-android-build:
    name: JARVIS Android Build (Step 1)
    max_build_duration: 30
    environment:
      flutter: 3.38.0
      vars:
        # Future steps (Claude API key, etc.) will be added here as
        # SECURE environment variables inside the Codemagic dashboard -
        # never typed directly into this file or committed to GitHub.
        PACKAGE_NAME: "com.jarvis.assistant"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
